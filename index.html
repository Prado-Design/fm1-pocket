<style>
/* Layout: one 1003×463 faceplate (the user's SVG) scaled to fit the screen; landscape, rotates itself on a portrait phone. */
:root{
  --ground:#0d0d0d; --plate:#171717; --ink:#d9d9d9; --dim:#6c737a;
  --led:#00ffff; --rec:#ff2b2b; --press:rgba(0,0,0,.42); --lit:rgba(0,255,255,.16);
  --ui:"Poppins",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#fit{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1003px;height:463px;transform-origin:0 0;background:var(--plate);border-radius:6px}
#art{position:absolute;inset:0;width:1003px;height:463px;max-width:none;pointer-events:none}
#lcd{position:absolute;left:380px;top:0;width:240px;height:240px;image-rendering:pixelated;background:#000}
.hit{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.hit:focus-visible{box-shadow:0 0 0 2px var(--dim)}
.hit::after{content:"";position:absolute;inset:0;border-radius:inherit;background:transparent;transition:background .06s}
.hit.lit::after{background:var(--lit)}
.hit.rec.lit::after{background:rgba(255,43,43,.28)}
.hit.down::after{background:var(--press)}
.pad .dot{position:absolute;left:50%;top:19px;width:9px;height:10px;margin-left:-4.5px;border-radius:5px;background:transparent}
.pad.lit .dot{background:var(--led);box-shadow:0 0 8px 2px rgba(0,255,255,.55)}
.pad.lit::after,.white.lit::after{background:transparent}
.white .bar{position:absolute;left:50%;top:19px;width:8.7px;height:56.3px;margin-left:-4.35px;border-radius:4.3px;background:transparent}
.white.lit .bar{background:var(--led);box-shadow:0 0 10px 2px rgba(0,255,255,.45)}
.knob{border-radius:50%}
.knob .cap{position:absolute;inset:7px;border-radius:50%}
.knob .tick{position:absolute;left:50%;top:9px;width:4px;height:17px;margin-left:-2px;border-radius:2px;background:var(--ink);transform-origin:50% calc(100% + 13px)}
.knob.master .cap{background:#191919}
.knob.down::after{background:rgba(255,255,255,.05)}
#tools{position:absolute;left:300px;top:140px;display:flex;flex-direction:column;gap:8px}
#tools button{width:30px;height:30px;border-radius:15px;border:0;background:#202020;color:var(--dim);display:grid;place-items:center;cursor:pointer}
#tools button:focus-visible{outline:2px solid var(--dim)}
#tools button[aria-pressed="true"]{color:var(--led)}
#tools svg{width:16px;height:16px}
#hint{position:absolute;left:380px;top:206px;width:240px;text-align:center;font:500 11px/1 var(--ui);color:var(--dim);letter-spacing:.06em;pointer-events:none;transition:opacity .4s}
#hint.gone{opacity:0}
#jam{position:absolute;left:380px;top:0;width:240px;height:240px;padding:18px 16px 16px;background:rgba(13,13,13,.96);display:flex;flex-direction:column;gap:10px;font-family:var(--ui)}
#jam h2{margin:0;font:600 12px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
#jam p{margin:0;font:400 12px/1.45 var(--ui);color:#a3a9ae}
#jam-link{font:500 11px/1.35 ui-monospace,Menlo,monospace;color:var(--ink);background:#1b1b1b;border-radius:6px;padding:7px 8px;word-break:break-all;-webkit-user-select:text;user-select:text}
.jam-row{margin-top:auto;display:flex;gap:8px}
.jam-row button{flex:1;height:32px;border:0;border-radius:16px;background:#242424;color:var(--dim);font:500 12px/1 var(--ui);cursor:pointer}
.jam-row button.main{background:var(--ink);color:var(--ground)}
.jam-row button:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
#fail{position:absolute;left:390px;top:80px;width:220px;font:12px/1.4 var(--ui);color:var(--ink);text-align:center}
@media (prefers-reduced-motion:reduce){.hit::after,#hint{transition:none}}
</style>

</head>

function coreRuntime(){
  const sameBytes=(a,b)=>{if(!a||a.length!==b.length)return false;for(let i=0;i<b.length;i++)if(a[i]!==b[i])return false;return true;};
  return class FM1Core{
    constructor(wasm,flash,snapshot){
      this.c=new WebAssembly.Instance(new WebAssembly.Module(wasm),{}).exports;
      const c=this.c;c._initialize();
      if(snapshot){
        c.memory.grow((snapshot.byteLength-c.memory.buffer.byteLength)/65536);
        new Uint8Array(c.memory.buffer).set(new Uint8Array(snapshot));
      }else{
        const saved=flash?.length===536576;
        if(saved)new Uint8Array(c.memory.buffer,c.sim_flash(),536576).set(flash);
        c.sim_boot(saved?0:1);
      }
      this.lastFrame=this.lastFlash=-1;
    }
    command(m){
      const c=this.c;
      switch(m.type){
        case'control':c.sim_control(m.kind,m.index,m.value);break;
        case'release':c.sim_release();break;
        case'panic':c.sim_panic();break;
        case'tick':for(let i=0;i<Math.min(32,m.blocks>>>0);i++)c.sim_render();break;
      }
    }
    frame(force=false){
      const c=this.c,msg={type:'frame',state:new Uint8Array(c.memory.buffer,c.sim_state(),225).slice()};
      const rev=c.sim_frame_revision();

        const changed=c.sim_frame_changes(),bands=force||this.lastFrame<0?32767:changed;

        if(bands===32767)msg.pixels=src.slice();
        else{
          let n=0;for(let b=bands;b;b&=b-1)n++;
          msg.pixels=new Uint16Array(n*3840);
          for(let band=0,at=0;band<15;){

      }

      if(fr!==this.lastFlash){msg.flash=new Uint8Array(c.memory.buffer,c.sim_flash(),536576).slice();this.lastFlash=fr;}
      return msg;

  history.replaceState(null,'',location.pathname+location.search);
  setGain();control(3,0,Math.round(volume*1023/100));jamStatus();
  if(guest)jamShow('Session ended','The song you were playing is on your FM-1 now, unsaved. Press SAVE to keep it.',['OK',jamHide]);
  else jamHide();
}

/* guest */
async function netJoin(id){
  const attempt=++net.attempt;
  jamShow('Joining','Connecting to your friend’s FM-1…',null,['Cancel',netEnd]);
  await startAudio();
  if(attempt!==net.attempt)return;
  if(!node){jamShow('Join','Sound has to be working to play together. Tap Join to try again.',['Join',()=>netJoin(id)],['Not now',jamHide]);return;}
  try{await netOpen(id);}catch(_){netFail('Playing together needs the online FM-1 Pocket site.');return;}
  if(attempt!==net.attempt){net.room.leave();return;}
  net.role='guest';jamStatus();keepAwake();
  jamShow('Joining','Looking for your friend’s session. Keep FM-1 Pocket open on their phone too.',null,['Cancel',netEnd]);
  net.timer=setTimeout(()=>{if(!net.live)netFail('Your friend’s session didn’t answer. Check it’s still open on their phone, then try the link again.');},120000);
  net.act.onMessage=(d,{peerId})=>{
    if(d.t==='hi'&&d.host&&(!net.host||net.host===peerId)){
      if(d.v!==net.tag){netFail('Your FM-1 Pocket and your friend’s are different versions. Reload both, then try again.');return;}
      net.host=peerId;net.act.send({t:'hi',v:net.tag},{target:peerId}).catch(()=>{});
      if(!net.live)jamShow('Joining','Loading your friend’s synth…',null,['Cancel',netEnd]);return;
    }
    if(peerId!==net.host)return;
    if(d.t==='e')node.port.postMessage({type:'net',front:d.b,events:[{s:d.s,b:d.b,m:d.m}]});
    else if(d.t==='h')node.port.postMessage({type:'net',front:d.b,events:[]});
    else if(d.t==='x')check(d.b,d.h,'host');
    else if(d.t==='bad')netFail('Your FM-1 Pocket and your friend’s are different versions. Reload both, then try again.');
  };
  net.snap.onMessage=async(data,{peerId,metadata})=>{
    if(peerId!==net.host||net.role!=='guest')return;
    const mem=await pack(data,false);
    node.port.postMessage({type:'load',mem:mem.buffer,b:metadata.b,s:metadata.s},[mem.buffer]);
    net.hashes.clear();
    if(!net.live){net.live=true;net.volume=volume;setGain();clearTimeout(net.timer);
      jamShow('Connected','You’re playing your friend’s FM-1. Your presses reach it after a short delay.',['OK',jamHide],['Leave',netEnd]);}
    else if(net.lost){net.lost=false;clearTimeout(net.timer);jamHide();}
  };
  net.room.onPeerLeave=peer=>{
    if(peer!==net.host||!net.live){if(peer===net.host)net.host=null;return;}
    net.lost=true;clearTimeout(net.timer);
    jamShow('Reconnecting','Lost the connection to your friend’s phone. Waiting for it to come back…',null,['Leave',netEnd]);
    net.timer=setTimeout(netEnd,120000);
  };
}
function netFail(text){netEnd().then(()=>jamShow('Couldn’t join',text,['OK',jamHide]));}
function resync(){const t=performance.now();if(net.host&&t-net.resyncAt>5000){net.resyncAt=t;net.act.send({t:'re'},{target:net.host}).catch(()=>{});}}
function check(b,h,from){
  const seen=net.hashes.get(b);
  if(!seen){net.hashes.set(b,{from,h});for(const k of net.hashes.keys())if(k<b-8192)net.hashes.delete(k);return;}
  if(seen.from===from)return;
  net.hashes.delete(b);if(seen.h!==h)resync();
}
function netInput(kind,index,value){
  if(kind===3){setGain();return;} // each phone keeps its own volume
  if(kind<2){const key=kind*32+index;value?net.mine.add(key):net.mine.delete(key);}
  if(net.role==='host')apply('me',kind,index,value);
  else net.act.send({t:'in',k:kind,i:index,v:value},{target:net.host}).catch(()=>{});
}
function netWorklet(m){
  if(m.type==='ev'){const e=m.e;toPeers({t:'e',s:e.s,b:e.b,m:e.m});}
  else if(m.type==='snap'&&net.peers.has(m.peer))
    pack(m.mem,true).then(z=>net.snap.send(z,{target:m.peer,metadata:{b:m.b,s:m.s}})).catch(()=>{});
  else if(m.type==='hash'){if(net.role==='host')toPeers({t:'x',b:m.b,h:m.h});else if(net.live)check(m.b,m.h,'me');}
  else if(m.type==='behind')resync();
}
$('t-jam').addEventListener('click',()=>{
  if(net.role==='host'){jam.hidden?(jam.hidden=false,jamStatus()):jamHide();return;}
  if(net.role==='guest'){jam.hidden?jamShow('Connected','You’re playing your friend’s FM-1.',['OK',jamHide],['Leave',netEnd]):jamHide();return;}
  if(!jam.hidden){jamHide();return;}
  jamShow('Play together','Start a session and send the link to a friend. You’ll share this FM-1: the song, the screen and every control.',
    ['Start',netHost],['Close',jamHide]);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&audioOn&&ctx.state!=='running')ctx.resume();});
addEventListener('blur',()=>{if(net.live)for(const key of [...net.mine])netInput(key>>5,key&31,0);else send({type:'release'});for(const el of stage.querySelectorAll('.down'))el.classList.remove('down');});

/* ---- boot the firmware on the page; it ticks here until sound starts ---- */
try{
  const bin=atob(FM1_WASM_B64);wasm=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)wasm[i]=bin.charCodeAt(i);
  {let h=2166136261;for(let i=0;i<wasm.length;i++)h=Math.imul(h^wasm[i],16777619)>>>0;net.tag=h.toString(36);}
  const Core=coreRuntime();core=new Core(wasm,loadFlash());
  control(3,0,Math.round(volume*1023/100));
  receive(core.frame(true));
  const bf=core.c.sim_block_frames();let last=performance.now(),frames=0;
  setInterval(()=>{
    const now=performance.now();frames+=Math.min(40,now-last)*44.1;last=now;
    const blocks=Math.floor(frames/bf);frames%=bf;
    if(core&&!starting){core.command({type:'tick',blocks});receive(core.frame());}
  },20);
  const invite=/[#&]jam=([a-z0-9]{4,32})/.exec(location.hash);
  if(invite)jamShow('Play together','A friend invited you to play their FM-1 with them. Your own songs stay safe on this phone.',
    ['Join',()=>netJoin(invite[1])],['Not now',()=>{history.replaceState(null,'',location.pathname+location.search);jamHide();}]);
}catch(err){
  const f=document.createElement('div');f.id='fail';f.textContent='The FM-1 engine could not start here: '+err.message;stage.append(f);
}
})();
</script>
